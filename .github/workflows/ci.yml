name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The two most recent minor releases (docs/spec.md §9a.3). The floor in
        # go.mod is a patch version, not just a minor, because root-scoped
        # filesystem access has had escapes fixed within a minor series.
        go: ['1.25.12', '1.26.5']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      # Not a copy of the checks --- the same file a maintainer runs, so the
      # two cannot drift. Add a check in scripts/check and CI gets it.
      - run: ./scripts/check
