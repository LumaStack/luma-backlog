# luma-backlog configuration — see docs/spec.md §8
# The source of truth. Deliberately minimal; keys are added when something
# needs them, not in advance.

lkf_version:    0.0.2          # format grammar this bundle is written against
type_namespace: luma/backlog   # records write short type names; this resolves them

# The number is the status's ordinal, and it prefixes every rank at that
# status, so sorting the rank field alone gives board order (ADR-0005). Spaced
# so a status can be inserted between two others without renumbering.
# A status shared by two units carries the same ordinal in both.
workflow_status:
  work-item:
    captured:    10
    unprepared:  20
    preparing:   30
    prepared:    40
    todo:        50
    in_progress: 60
    closed:      70
  task:
    todo:        50
    in_progress: 60
    closed:      70

columns:
  Captured:    [captured]
  Preparing:   [unprepared, preparing, prepared]
  To Do:       [todo]
  In Progress: [in_progress]
  Closed:      [closed]
