# Generated by `luma-foreman apply`. Edits are lost.
#
# Every Document that says when it applies, and what happens when it is
# not complied with. The permission gate reads the rows that block; it
# cannot be told to ignore them, and nothing in `agent-permissions`
# writes here.

[[rule]]
bundle = "lumastack/luma-catalog/backlog-ideas"
document = "policy/capturing-ideas"
title = "What is worth capturing"
path = ".luma/bundles/lumastack/luma-catalog/backlog-ideas/policy/capturing-ideas.md"
on_violation = "allow"
matches = ["eager"]

[[rule]]
bundle = "lumastack/luma-catalog/backlog-ideas"
document = "policy/tending-ideas"
title = "Tending ideas"
path = ".luma/bundles/lumastack/luma-catalog/backlog-ideas/policy/tending-ideas.md"
on_violation = "allow"
matches = ["topic:pruning, archiving or reviewing a backlog"]

